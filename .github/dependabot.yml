# T6.2 — avisos de atualização de segurança (PRs revisados por humano; nada é mergeado sozinho).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    # Versões maiores destes pacotes mexem no projeto todo (ex.: TS 7 ainda sem suporte no typescript-eslint):
    # viram tarefa própria, não PR automático. @types/node acompanha o Node do CI (22).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
